name: Sync YouTube + Deploy Pages

on:
  workflow_dispatch:

  schedule:
    - cron: '17 * * * *'

  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync entire Olexa YouTube channel
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_HANDLE: '@OlexaYT'
        run: npm run sync

      - name: Verify generated site data
        run: npm run verify

      - name: Save refreshed YouTube data and game catalog
        run: |
          if git diff --quiet -- data/videos.json data/games.json data/game-audit.json reports/data-quality.md; then
            echo "No YouTube or game-catalog changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/videos.json data/games.json data/game-audit.json reports/data-quality.md
            git commit -m "chore: sync YouTube archive and game catalog"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
