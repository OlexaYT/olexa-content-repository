name: Sync YouTube Catalog

on:
  workflow_dispatch:

  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: youtube-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync YouTube and rebuild the game catalog
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_HANDLE: '@OlexaYT'
        run: npm run sync

      - name: Verify generated site data
        run: npm run verify

      - name: Save refreshed catalog safely
        shell: bash
        run: |
          generated_files=(
            data/videos.json
            data/games.json
            data/game-audit.json
            reports/data-quality.md
          )

          if git diff --quiet -- "${generated_files[@]}"; then
            echo "No YouTube or game-catalog changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${generated_files[@]}"
          git commit -m "chore: sync YouTube archive and game catalog"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Generated data conflicts with newer main; leaving the remote unchanged."
              exit 1
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Remote main advanced during the push; retrying from its newest commit."
          done

          echo "Could not publish generated data after three attempts."
          exit 1
